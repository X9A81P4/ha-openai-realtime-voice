<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1b1f; --muted:#6b6f76; --card:#f3f4f6; --accent:#0b6bcb; --danger:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --fg:#ececf0; --muted:#9a9ea6; --card:#1c1d21; --accent:#4ea3ff; --danger:#ff6b6b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--card); }
  button { font:inherit; padding:10px 18px; border-radius:10px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button.stop { background:var(--danger); }
  button.ghost { background:var(--card); color:var(--fg); }
  #status { color:var(--muted); font-size:14px; }
  #log { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; background:var(--card); }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.tool { font:13px ui-monospace, monospace; color:var(--muted); background:transparent; padding:0 4px; }
  #confirm { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); align-items:center; justify-content:center; padding:16px; }
  #confirm .box { background:var(--bg); border-radius:14px; padding:20px; max-width:480px; width:100%; }
  #confirm pre { white-space:pre-wrap; word-break:break-word; background:var(--card); padding:10px; border-radius:8px; font-size:13px; }
  #confirm .row { display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
  #dbgbar { padding:6px 12px; font-size:12px; border-top:1px solid #444; }
  #live { opacity:.8; margin-left:8px; }
  #dbg { margin:0; padding:8px 12px; font-size:11px; line-height:1.35; height:34vh; overflow:auto; white-space:pre-wrap; word-break:break-all; background:rgba(0,0,0,.25); }
</style>
</head>
<body>
<header>
  <button id="toggle">Start</button>
  <span id="status">Idle</span> <button id="audio-fix" style="display:none;margin-left:10px">Tap to enable sound</button> <a href="" target="_blank" id="full" style="margin-left:12px;color:#8ab4f8">Open full page</a>
</header>
<div id="log"></div>
<div id="dbgbar"><button id="beep" class="ghost">Test speaker</button> <button id="copy" class="ghost">Copy logs</button> <button id="clr" class="ghost">Clear</button> <span id="live"></span></div>
<pre id="dbg"></pre>
<div id="confirm"><div class="box">
  <strong>Confirm action</strong>
  <p>The assistant wants to run a potentially destructive tool:</p>
  <pre id="confirm-text"></pre>
  <div class="row"><button class="ghost" id="deny">Cancel</button><button class="stop" id="allow">Confirm</button></div>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
let pc = null, dc = null, stream = null, audioEl = null, running = false;
const handled = new Set();

function say(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}
document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('full'); if(f) f.href=location.href;});

const T0 = Date.now(); let dbgLines = [];
function dbg(msg) {
  const t = ((Date.now() - T0) / 1000).toFixed(2).padStart(7);
  const line = t + 's ' + msg; dbgLines.push(line); if (dbgLines.length > 800) dbgLines.shift();
  const el = $('dbg'); el.textContent += line + '\n'; el.scrollTop = el.scrollHeight;
  if (/^(evt (error|response\.(created|done))|first audio|WARNING|OpenAI|tool |audio\.play|ontrack|ice |pc |getUserMedia)/.test(msg)) {
    try { fetch('./clientlog', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ msg }) }); } catch {}
  }
}
window.addEventListener('error', (e) => dbg('JS ERROR: ' + e.message));
window.addEventListener('unhandledrejection', (e) => dbg('PROMISE REJECTED: ' + (e.reason && e.reason.message || e.reason)));
let tm = {}, nAudioDelta = 0, nTextDelta = 0, statTimer = null;
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 660; g.gain.value = 0.2;
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.4);
    dbg('beep via WebAudio, ctx=' + ac.state + ' (heard nothing? check ringer switch, volume, output route)');
  } catch (e) { dbg('beep failed: ' + e.message); }
}
async function pollStats() {
  if (!pc) return;
  if (tm.created && !tm.firstAudio && Date.now() - tm.created > 8000 && !tm.warned) { tm.warned = true; dbg('WARNING: response created ' + Math.round((Date.now() - tm.created) / 1000) + 's ago with no audio and no response.done'); }
  if (!pc) return;
  try {
    const st = await pc.getStats(); const o = [];
    st.forEach((r) => {
      if (r.type === 'inbound-rtp' && r.kind === 'audio') o.push('IN pkts=' + r.packetsReceived + ' bytes=' + r.bytesReceived + ' lvl=' + (r.audioLevel ?? 'n/a') + ' concealed=' + (r.concealedSamples ?? 0));
      if (r.type === 'outbound-rtp' && r.kind === 'audio') o.push('OUT pkts=' + r.packetsSent + ' bytes=' + r.bytesSent);
    });
    const a = audioEl ? ('el paused=' + audioEl.paused + ' muted=' + audioEl.muted + ' vol=' + audioEl.volume + ' ready=' + audioEl.readyState + ' t=' + audioEl.currentTime.toFixed(1)) : 'el none';
    const line = o.join(' | ') + ' | ' + a + ' | ice=' + pc.iceConnectionState + ' dc=' + (dc && dc.readyState);
    $('live').textContent = line; if (pollStats.last !== line) { dbg('STATS ' + line); pollStats.last = line; }
  } catch (e) { dbg('stats error ' + e.message); }
}
function setStatus(s) { $('status').textContent = s; }

function askConfirm(summary) {
  return new Promise((resolve) => {
    $('confirm-text').textContent = summary;
    $('confirm').style.display = 'flex';
    const done = (v) => { $('confirm').style.display = 'none'; resolve(v); };
    $('allow').onclick = () => done(true);
    $('deny').onclick = () => done(false);
  });
}

async function runTool(item) {
  if (handled.has(item.call_id)) return;
  handled.add(item.call_id);
  say('tool: ' + item.name, 'tool'); const tt = Date.now(); dbg('tool start ' + item.name + ' ' + String(item.arguments).slice(0, 200));
  let out;
  try {
    let r = await fetch('./tool', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: item.name, arguments: item.arguments }) });
    let j = await r.json();
    if (j.needs_confirmation) {
      const ok = await askConfirm(j.summary);
      if (!ok) { out = JSON.stringify({ error: 'The user declined this action.' }); }
      else {
        r = await fetch('./tool', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: item.name, arguments: item.arguments, confirmed: true }) });
        j = await r.json();
        out = j.output;
      }
    } else { out = j.output ?? JSON.stringify(j); }
  } catch (e) { out = JSON.stringify({ error: String(e) }); }
  dbg('tool done ' + item.name + ' in ' + (Date.now() - tt) + 'ms, output ' + String(out).length + ' chars');
  dc.send(JSON.stringify({ type: 'conversation.item.create',
    item: { type: 'function_call_output', call_id: item.call_id, output: out } }));
  dc.send(JSON.stringify({ type: 'response.create' }));
}

function onEvent(ev) {
  const ty = ev.type;
  if (ty === 'response.output_audio.delta') { nAudioDelta++; if (nAudioDelta === 1) tm.firstAudio = Date.now(); if (nAudioDelta === 1) dbg('first audio chunk (+' + (Date.now() - (tm.created || Date.now())) + 'ms after response.created)'); }
  else if (ty === 'response.output_audio_transcript.delta' || ty === 'response.output_text.delta') { nTextDelta++; }
  else if (ty === 'rate_limits.updated') { }
  else {
    let extra = '';
    if (ty === 'error') extra = ' ' + JSON.stringify(ev.error || ev).slice(0, 400);
    if (ty === 'response.done') {
      const r = ev.response || {};
      extra = ' status=' + r.status + (r.status_details ? ' ' + JSON.stringify(r.status_details).slice(0, 300) : '') + (r.usage ? ' out_tokens=' + r.usage.output_tokens : '') + ' audio_chunks=' + nAudioDelta + ' text_deltas=' + nTextDelta;
      if (nAudioDelta === 0) dbg('WARNING: response finished with ZERO audio chunks');
      nAudioDelta = 0; nTextDelta = 0;
    }
    if (ty === 'response.created') { tm.created = Date.now(); tm.firstAudio = 0; tm.warned = false; if (tm.stopped) extra = ' (+' + (tm.created - tm.stopped) + 'ms after you stopped speaking)'; }
    if (ty === 'input_audio_buffer.speech_stopped') tm.stopped = Date.now();
    if (ty === 'response.output_item.done' && ev.item) extra = ' item=' + ev.item.type + (ev.item.name ? ':' + ev.item.name : '');
    dbg('evt ' + ty + extra);
  }
  switch (ev.type) {
    case 'conversation.item.input_audio_transcription.completed':
      if (ev.transcript && ev.transcript.trim()) say(ev.transcript.trim(), 'user'); break;
    case 'response.output_audio_transcript.done':
      if (ev.transcript) say(ev.transcript, 'assistant'); break;
    case 'response.output_item.done':
      if (ev.item && ev.item.type === 'function_call') runTool(ev.item); break;
    case 'input_audio_buffer.speech_started': setStatus('Listening…'); break;
    case 'input_audio_buffer.speech_stopped': setStatus('Thinking…'); break;
    case 'response.done': setStatus('Connected'); break;
    case 'error': say('Error: ' + (ev.error && ev.error.message || 'unknown'), 'tool'); break;
  }
}

async function start() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const framed = window.self !== window.top;
    say('Microphone API unavailable here (secure=' + window.isSecureContext + ', framed=' + framed + '). ' +
        (framed ? 'The HA app blocks the mic in the sidebar frame. Use "Open full page" above, in Safari or Chrome.' :
                  'This page needs HTTPS.'), 'tool');
    return;
  }
  setStatus('Connecting…');
  const ts = Date.now(); dbg('POST ./session (add-on -> OpenAI client_secrets)');
  const s = await fetch('./session', { method: 'POST' });
  dbg('./session -> ' + s.status + ' in ' + (Date.now() - ts) + 'ms');
  const sj = await s.json();
  if (!s.ok) { setStatus('Idle'); say(sj.error || 'Failed to start', 'tool'); return; }

  dbg('session ok: model=' + sj.model + ' tools=' + sj.tool_count);
  pc = new RTCPeerConnection();
  pc.oniceconnectionstatechange = () => dbg('ice ' + pc.iceConnectionState);
  pc.onconnectionstatechange = () => dbg('pc ' + pc.connectionState);
  audioEl = document.createElement('audio');
  audioEl.autoplay = true; audioEl.playsInline = true; audioEl.setAttribute('playsinline', '');
  audioEl.style.display = 'none'; document.body.appendChild(audioEl);
  ['playing', 'pause', 'stalled', 'error', 'suspend'].forEach((n) => audioEl.addEventListener(n, () => dbg('audio element: ' + n + (audioEl.error ? ' ' + audioEl.error.message : ''))));
  audioEl.play().catch((e) => dbg('pre-play (fails until a track exists): ' + e.name));
  pc.ontrack = (e) => {
    dbg('ontrack kind=' + e.track.kind + ' streams=' + e.streams.length + ' muted=' + e.track.muted + ' state=' + e.track.readyState);
    const ms = (e.streams && e.streams[0]) || new MediaStream([e.track]);
    audioEl.srcObject = ms; audioEl.muted = false; audioEl.volume = 1;
    audioEl.play().then(() => dbg('audio.play() ok')).catch((err) => { dbg('audio.play() BLOCKED: ' + err.name + ' ' + err.message); $('audio-fix').style.display = 'inline-block'; });
  };
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) { setStatus('Idle'); say('Mic blocked: ' + e.name + ' ' + e.message, 'tool'); dbg('getUserMedia failed: ' + e.name); try { pc.close(); } catch {} return; }
  dbg('mic ok: ' + (stream.getAudioTracks()[0].label || 'unnamed') + ' state=' + stream.getAudioTracks()[0].readyState);
  pc.addTrack(stream.getAudioTracks()[0], stream);
  dc = pc.createDataChannel('oai-events');
  dc.onopen = () => dbg('datachannel open'); dc.onclose = () => dbg('datachannel closed'); dc.onerror = () => dbg('datachannel error');
  dc.onmessage = (e) => { try { onEvent(JSON.parse(e.data)); } catch {} };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  const tc = Date.now(); dbg('OpenAI POST /v1/realtime/calls (sdp ' + offer.sdp.length + ' bytes)');
  const r = await fetch('https://api.openai.com/v1/realtime/calls', {
    method: 'POST', body: offer.sdp,
    headers: { Authorization: 'Bearer ' + sj.client_secret, 'Content-Type': 'application/sdp' } });
  if (!r.ok) { const tx = await r.text(); dbg('OpenAI /calls failed ' + r.status + ' ' + tx.slice(0, 300)); say('OpenAI connect failed: ' + r.status, 'tool'); stop(); return; }
  dbg('OpenAI /calls -> ' + r.status + ' in ' + (Date.now() - tc) + 'ms');
  await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
  running = true; dbg('webrtc connected'); statTimer = setInterval(pollStats, 2000);
  $('toggle').textContent = 'Stop'; $('toggle').classList.add('stop');
  setStatus('Connected (' + sj.tool_count + ' tools)');
}

function stop() {
  dbg('stop'); clearInterval(statTimer);
  try { dc && dc.close(); } catch {}
  try { pc && pc.close(); } catch {}
  try { if (audioEl) { audioEl.pause(); audioEl.srcObject = null; audioEl.remove(); } } catch {}
  audioEl = null; $('audio-fix').style.display = 'none';
  try { stream && stream.getTracks().forEach((t) => t.stop()); } catch {}
  pc = dc = stream = null; running = false;
  $('toggle').textContent = 'Start'; $('toggle').classList.remove('stop');
  setStatus('Idle');
}

$('audio-fix').onclick = () => { audioEl && audioEl.play().then(() => { $('audio-fix').style.display = 'none'; }).catch((e) => say('Audio blocked: ' + e.message, 'tool')); };
$('beep').onclick = beep;
$('clr').onclick = () => { $('dbg').textContent = ''; dbgLines = []; };
$('copy').onclick = () => { const t = dbgLines.join('\n'); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => dbg('logs copied'), () => { const r = document.createRange(); r.selectNodeContents($('dbg')); getSelection().removeAllRanges(); getSelection().addRange(r); dbg('text selected: use Copy from the menu'); }); };
$('toggle').onclick = () => (running ? stop() : (dbg('start pressed; secure=' + window.isSecureContext + ' framed=' + (window.self !== window.top) + ' ua=' + navigator.userAgent.slice(0, 90)), start()).catch((e) => { say(String(e), 'tool'); stop(); }));
</script>
</body>
</html>
