name: "OpenAI Realtime Voice"
version: "0.2.0"
slug: openai_realtime_voice
description: "Talk to Home Assistant with the OpenAI Realtime API (speech-to-speech) from a sidebar panel"
url: "https://platform.openai.com/docs/guides/realtime"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:microphone-message
panel_title: "Voice"
panel_admin: true
startup: application
boot: auto
options:
  openai_api_key: ""
  ha_mcp_url: ""
  model: "gpt-realtime-2.1"
  tool_allowlist: "ha_search,ha_get_state,ha_get_overview,ha_list_floors_areas,ha_get_entity,ha_get_device,ha_call_service,ha_bulk_control,ha_list_services,ha_get_history,ha_get_todo,ha_set_todo_item,ha_get_operation_status,ha_config_get_calendar_events"
  voice: "marin"
  confirm_destructive: true
  max_tool_output_chars: 12000
  instructions: "You are a voice assistant for a smart home. Keep replies short and conversational. Use the available tools to look up or change things in Home Assistant. Before anything destructive, say what you are about to do. If a tool call is held for confirmation, tell the user to press Confirm on screen."
schema:
  openai_api_key: password
  ha_mcp_url: str
  model: str
  tool_allowlist: str
  voice: str
  confirm_destructive: bool
  max_tool_output_chars: int(2000,50000)
  instructions: str
